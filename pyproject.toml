[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northcord"
version = "1.0.0"
description = "Discord, reimagined for the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["discord", "terminal", "tui", "chat", "voice"]
authors = [
    { name = "NorthCodeBase" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=0.50.0",
    "requests>=2.28.0",
    "websocket-client>=1.5.0",
    "opuslib>=3.0.0",
    "miniaudio>=1.0.0",
    "cryptography>=39.0.0",
    "pyaudio>=0.2.11",
]

[project.urls]
Homepage = "https://github.com/northcodebase/northcord"
Repository = "https://github.com/northcodebase/northcord"
Documentation = "https://github.com/northcodebase/northcord#readme"
"Bug Tracker" = "https://github.com/northcodebase/northcord/issues"

[project.scripts]
northcord = "northcord.main:main"

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "pytest>=7.4.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["northcord*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["E501", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
